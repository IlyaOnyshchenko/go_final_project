name: go_final_project pipeline
on: push


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get Dependencies
        run: go mod download

      - name: Run Server in Background
        run: |
          go run main.go &
          echo $! > server_pid.txt  # сохраняем PID процесса

      - name: Wait for Server to Be Ready
        run: |
          timeout 120 bash -c '
            until curl -s http://localhost:7540/health | grep -q "ok"; do
              echo "Waiting for server (http://localhost:7540/health)..."
              sleep 5
            done
            echo "Server is ready!"
          ' || (echo "Server did not start in time"; exit 1)
          
      - name: Run Tests
        run: go test ./... -v -cover

      - name: Stop Server
        if: always()
        run: |
          if [ -f server_pid.txt ]; then
            kill $(cat server_pid.txt) || echo "Failed to kill server (maybe already stopped)"
            rm -f server_pid.txt
          else
            echo "No server PID file found"
          fi
