name: go_final_project Pipeline
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Get Dependencies
        run: go mod tidy

      - name: Start Server
        run: |
          go run main.go > server.log 2>&1 &
          echo $! > server_pid.txt
          sleep 15  # ждём старта сервера

      - name: Run Tests
        run: go test ./... -v -cover

      - name: Stop Server
        if: always()
        run: |
          if [ -f server_pid.txt ]; then
            kill $(cat server_pid.txt) || echo "Server already stopped"
            rm -f server_pid.txt
          fi

      - name: Show Server Logs (if failed)
        if: failure()
        run: cat server.log || echo "No logs"

  deploy:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ilyaonyshschenko1994/todo-app-repo
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
