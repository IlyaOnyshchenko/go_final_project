name: Go CI — Simple Server + Tests
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Get Dependencies
        run: go mod tidy

      # 1. Запуск сервера + запись PID и логов
      - name: Start Server
        run: |
          go run main.go > server.log 2>&1 &
          echo $! > server_pid.txt
          sleep 15  # ждём 15 секунд — подберите под свой сервер

      # 2. Запуск тестов
      - name: Run Tests
        run: go test ./... -v -cover

      # 3. Остановка сервера
      - name: Stop Server
        if: always()
        run: |
          if [ -f server_pid.txt ]; then
            kill $(cat server_pid.txt) || echo "Server already stopped"
            rm -f server_pid.txt
          fi

      # 4. Вывод логов при ошибке
      - name: Show Server Logs (if failed)
        if: failure()
        run: cat server.log || echo "No logs"
